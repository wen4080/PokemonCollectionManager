name: 更新 Pokémon 主資料

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/master_data/**"
      - ".github/workflows/update-master-data.yml"
  schedule:
    - cron: "17 17 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# 背卡圖片索引與上一版完整預覽快取會一併參與每次發佈，避免完整圖層退化。

concurrency:
  group: pokemon-master-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取得專案
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝圖片最佳化工具
        run: python -m pip install Pillow==11.3.0

      - name: 下載並產生主資料
        shell: pwsh
        run: |
          Set-Location tools/master_data
          python fetch_master_data.py --output-dir downloads --force
          python parse_game_master.py --input-dir downloads --output-dir generated
          python fetch_background_previews.py --output-dir ../../app/src/main/assets/images/background_previews --manifest generated/background_preview_manifest.json --catalog generated/game_master_catalog.json
          if ($LASTEXITCODE -ne 0) { Write-Warning "部分完整預覽更新失敗，繼續使用已收錄預覽與遊戲靜態底圖。" }
          $version = Get-Date -Format "yyyy.MM.dd.HHmm"
          python build_pokemon_catalog.py --input-dir downloads --parsed-dir generated --output-dir generated --background-preview-manifest generated/background_preview_manifest.json --version $version

      - name: 建立靜態更新站
        shell: pwsh
        run: |
          $site = "dist/site/master-data"
          New-Item -ItemType Directory -Force "$site/images/background_previews" | Out-Null
          New-Item -ItemType Directory -Force "$site/images/background_optimized" | Out-Null
          New-Item -ItemType Directory -Force "$site/master" | Out-Null
          $repositoryName = "${{ github.event.repository.name }}"
          $assetBase = "https://${{ github.repository_owner }}.github.io/$repositoryName/master-data"
          $previousManifestPath = "$site/master/previous_master_manifest.json"
          $previousManifestUrl = "$assetBase/master_manifest.json"
          try {
            Invoke-WebRequest -Uri $previousManifestUrl -OutFile $previousManifestPath -UseBasicParsing
            Write-Host "已讀取上一版 GitHub Pages 主資料：$previousManifestUrl"
          } catch {
            Write-Warning "上一版公開主資料尚不可用，改用 App 內建主資料。"
            Copy-Item app/src/main/assets/master/master_manifest.json $previousManifestPath -Force
          }
          if (Test-Path app/src/main/assets/images/background_previews) {
            Copy-Item app/src/main/assets/images/background_previews/* "$site/images/background_previews/" -Force -ErrorAction SilentlyContinue
          }
          Copy-Item app/src/main/assets/images/background_optimized/* "$site/images/background_optimized/" -Force
          Copy-Item app/src/main/assets/master/background_image_index.json "$site/master/background_image_index.json" -Force
          Copy-Item app/src/main/assets/master/background_preview_integrity_index.json "$site/master/background_preview_integrity_index.json" -Force
          # GitHub Pages 不需要寫入主分支；每次執行從上一版公開 manifest
          # 下載已發佈的完整 WebP，讓新內容能跨次更新持續保留。
          try {
            $previous = Get-Content $previousManifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
            $previousUrls = @{}
            foreach ($background in $previous.backgrounds) {
              foreach ($field in @("previewImageKey", "imageKey")) {
                $value = [string]$background.$field
                if (-not $value) { continue }
                if ($value -match '^https://.+/images/background_optimized/[^/]+\.webp$') {
                  $previousUrls[$value] = $true
                } elseif ($value -match '^background_optimized/[^/]+\.webp$') {
                  $previousUrls["$assetBase/images/$value"] = $true
                }
              }
            }
            foreach ($url in $previousUrls.Keys) {
              $filename = [IO.Path]::GetFileName(([Uri]$url).AbsolutePath)
              $destination = Join-Path "$site/images/background_optimized" $filename
              if (-not (Test-Path $destination)) {
                try {
                  Invoke-WebRequest -Uri $url -OutFile $destination -UseBasicParsing
                } catch {
                  Write-Warning "上一版背卡快取下載失敗：$url"
                }
              }
            }
            Write-Host "已回讀上一版完整背卡快取：$($previousUrls.Count) 張"
          } catch {
            Write-Warning "上一版背卡快取索引無法解析，繼續使用內建快取。"
          }
          python tools/master_data/build_asset_manifest.py --manifest tools/master_data/generated/master_manifest.json --output tools/master_data/generated/background_asset_manifest.json --asset-dir $site --download --skip-cached-backgrounds --groups backgrounds
          python tools/master_data/optimize_background_assets.py --manifest tools/master_data/generated/master_manifest.json --asset-root $site --previous-manifest "$site/master/previous_master_manifest.json" --output-manifest tools/master_data/generated/master_manifest_optimized.json --backgrounds-output tools/master_data/generated/pokemon_backgrounds_optimized.json --quality 84 --max-size 512 --prune-sources
          python tools/master_data/validate_master_data.py --manifest tools/master_data/generated/master_manifest_optimized.json --asset-root $site --require-background-assets
          python tools/master_data/build_remote_update_manifest.py --manifest tools/master_data/generated/master_manifest_optimized.json --output "$site/master_manifest.json" --asset-base-url $assetBase
          Copy-Item tools/master_data/generated/pokemon_*.json $site -Force

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳靜態網站
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - name: 發佈 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

